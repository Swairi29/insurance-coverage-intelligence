# pytest.ini

[pytest]
minversion = 8.0
testpaths =
    agents
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Treat the repo root as the import root so `shared.*` and `agents.*` resolve
# without installing the project as a package.
pythonpath = .

addopts =
    -ra
    --strict-markers
    --tb=short

asyncio_mode = auto

markers =
    unit: fast, isolated tests with no network or filesystem dependencies
    contract: verifies the request/response contract between two agents
    integration: exercises the full orchestration pipeline
    security: input validation, PII redaction and auth checks
    evaluation: accuracy / quality benchmarks over labelled test cases
    slow: takes more than a couple of seconds
